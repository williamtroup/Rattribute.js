<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Rattribute.js - Minimized</title>
        <link rel="stylesheet" href="css/styles.css">
        <script src="../dist/rattribute.min.js"></script>
        <script src="js/scripts.js"></script>
    </head>

    <body>
        <div class="header">
            <img src="images/image.png" class="logo" />
            <h1 id="header">Rattribute.js - Minimized</h1>
            <p>This is a basic example of how to use Rattribute.js with different sizes for the links.</p>
        </div>

        <div class="contents">
            <p><a href="https://www.william-troup.com/" data-rattribute-js-sm="target=_blank;class=test-class" target="_self">Test Link SM</a></p>
            <p><a href="https://www.william-troup.com/" data-rattribute-js-md="target=_blank;class=test-class" target="_self">Test Link MD</a></p>
            <p><a href="https://www.william-troup.com/" data-rattribute-js-lg="target=_blank;class=test-class" target="_self">Test Link LG</a></p>
            <p><a href="https://www.william-troup.com/" data-rattribute-js-xl="target=_blank;class=test-class" target="_self">Test Link XL</a></p>
            <p><a href="https://www.william-troup.com/" data-rattribute-js-xxl="target=_blank;class=test-class" target="_self">Test Link XXL</a></p>
            <p><a href="https://www.william-troup.com/" data-rattribute-js-800="target=_blank;class=test-class" data-rattribute-js-lg="target=_parent">Test Link (800, MD)</a></p>
        </div>

        <div class="contents">
            <h2>Automation:</h2>
            <button onclick="start();">Start</button>
            <button onclick="stop();">Stop</button>
            <button onclick="fetch();">Fetch</button>
            <button onclick="refresh();">Refresh</button>
            <br />

            <h2>Configuration:</h2>
            <button onclick="setConfiguration();">Set Configuration</button>
            <br />

            <h2>Additional Data:</h2>
            <button onclick="getVersion();">Get Version</button>
        </div>
    </body>
</html>
